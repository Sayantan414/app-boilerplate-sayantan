name: Deploy to AWS EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Login to Amazon ECR
        run: |
          aws ecr get-login-password --region ap-south-1 | docker login --username AWS --password-stdin 703621194378.dkr.ecr.ap-south-1.amazonaws.com

      - name: Build and push backend image
        run: |
          docker build -t boilerplate-backend ./backend
          docker tag boilerplate-backend:latest 703621194378.dkr.ecr.ap-south-1.amazonaws.com/boilerplate-backend:latest
          docker push 703621194378.dkr.ecr.ap-south-1.amazonaws.com/boilerplate-backend:latest

      - name: Build and push frontend image
        run: |
          docker build -t boilerplate-frontend ./frontend
          docker tag boilerplate-frontend:latest 703621194378.dkr.ecr.ap-south-1.amazonaws.com/boilerplate-frontend:latest
          docker push 703621194378.dkr.ecr.ap-south-1.amazonaws.com/boilerplate-frontend:latest

      - name: Deploy on EC2
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            aws ecr get-login-password --region ap-south-1 | docker login --username AWS --password-stdin 703621194378.dkr.ecr.ap-south-1.amazonaws.com
            cd app
            docker-compose pull
            docker-compose down
            docker-compose up -d