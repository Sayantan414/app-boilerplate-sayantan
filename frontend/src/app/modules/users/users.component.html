<div class="flex-1 flex flex-col min-h-0 h-full pb-4">
  <header class="flex flex-wrap justify-between items-center gap-4 mb-6">
    <div>
      <h1 class="text-2xl font-bold text-foreground tracking-tight m-0">User Management</h1>
    </div>
    
    <div class="flex items-center gap-4 flex-wrap max-sm:w-full max-sm:justify-between">
      <div class="relative max-sm:flex-1">
        <svg class="absolute left-3 top-1/2 -translate-y-1/2 text-muted-foreground" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24"
          fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8" />
          <path d="m21 21-4.3-4.3" />
        </svg>
        <input type="text" class="w-[240px] pl-10 pr-4 py-2 border border-border rounded-md bg-background text-sm focus:outline-none focus:ring-1 focus:ring-primary max-sm:w-full" placeholder="Search users..." [ngModel]="searchQuery()"
          (ngModelChange)="onSearchQueryChange($event)">
      </div>

      <ui-button variant="outline" (click)="openFilterDrawer()" class="max-sm:flex-shrink-0">
        <div class="flex items-center gap-2">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3" />
          </svg>
          <span>Filters</span>
          @if (activeFilterCount() > 0) {
          <span class="bg-primary text-primary-foreground px-2 py-0.5 rounded-full text-xs font-semibold">{{ activeFilterCount() }}</span>
          }
        </div>
      </ui-button>

      <ui-button (click)="openAddModal()" class="max-sm:flex-shrink-0">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M5 12h14" />
          <path d="M12 5v14" />
        </svg>
        Add User
      </ui-button>
    </div>
  </header>

  <div class="flex-1 flex flex-col min-h-0 mb-0">
    @if (isLoading()) {
    <ui-table-skeleton [columns]="5" [rows]="8" class="w-full"></ui-table-skeleton>
    } @else {
    <ui-table [columns]="columns" [data]="filteredUsers()"
      emptyMessage="No team members found. Try adding a new user or adjusting your search."
      (onAction)="handleAction($event)"></ui-table>
    }
  </div>

  <!-- Add User Modal -->
  <form [formGroup]="userForm" (ngSubmit)="userForm.valid && saveUser()">
    <ui-modal [isOpen]="isAddModalOpen()" [title]="isEditMode() ? 'Edit User' : 'Create New User'"
      [description]="isEditMode() ? 'Modify the details below to update the team member\'s account.' : 'Fill in the details below to add a new team member to your workspace.'"
      size="md" (onClose)="closeModal()">
      <div class="flex flex-col gap-4 p-0">
        <ui-dynamic-form [formGroup]="userForm" [fields]="formFields()"></ui-dynamic-form>
      </div>

      <div footer class="flex items-center justify-between w-full">
        <ui-button variant="outline" type="button" (click)="closeModal()">Cancel</ui-button>
        <ui-button type="submit" [disabled]="userForm.invalid">{{ isEditMode() ? 'Save Changes' : 'Create User'
          }}</ui-button>
      </div>
    </ui-modal>
  </form>

  <!-- Advanced Filter Drawer -->
  <ui-drawer [isOpen]="isFilterDrawerOpen()" title="Filter User" size="sm" (onClose)="isFilterDrawerOpen.set(false)">
    <div class="flex flex-col gap-4 p-0">
      <div class="flex flex-col gap-4">
        <ui-dynamic-form [formGroup]="filterForm" [fields]="filterFormFields()"></ui-dynamic-form>
      </div>
    </div>

    <div footer class="flex items-center justify-between w-full">
      <ui-button variant="outline" (click)="resetFilters()">Clear All</ui-button>
      <ui-button (click)="applyFilters()">Apply Filters</ui-button>
    </div>
  </ui-drawer>
</div>
