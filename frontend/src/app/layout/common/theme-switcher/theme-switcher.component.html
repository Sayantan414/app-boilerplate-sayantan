<button (click)="layoutService.toggleTheme()" class="flex items-center justify-center w-10 h-10 rounded-md text-muted-foreground transition-all duration-200 hover:bg-accent hover:text-accent-foreground active:scale-95" [attr.aria-label]="'Toggle theme'">
  @if (layoutService.theme() === 'light') {
    <!-- Moon Icon -->
    <svg class="transition-transform duration-300 active:rotate-[15deg]" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
  } @else {
    <!-- Sun Icon -->
    <svg class="transition-transform duration-300 active:rotate-[15deg]" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>
  }
</button>
