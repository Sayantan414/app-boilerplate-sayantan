<div class="flex h-screen w-screen overflow-hidden bg-background"
  [class.sidebar-collapsed]="!layoutService.sidebarExpanded()" [class.mobile-sidebar-open]="mobileSidebarOpen()">

  <!-- Sidebar Overlay for Mobile -->
  <div
    class="fixed inset-0 bg-slate-950/40 backdrop-blur-sm z-[90] transition-opacity duration-300 opacity-0 pointer-events-none lg:hidden"
    [class.opacity-100]="mobileSidebarOpen()" [class.pointer-events-auto]="mobileSidebarOpen()"
    (click)="mobileSidebarOpen.set(false)"></div>

  <!-- Sidebar -->
  <aside
    class="sidebar h-full bg-sidebar-bg border-r border-sidebar-border flex flex-col transition-[width] duration-300 z-50 flex-shrink-0">
    <div class="h-16 flex items-center px-6">
      <div class="flex items-center gap-3 overflow-hidden">
        <div
          class="w-8 h-8 bg-primary text-primary-foreground rounded-md flex items-center justify-center font-extrabold flex-shrink-0">
          B</div>
        <span class="text-xl font-bold text-foreground whitespace-nowrap transition-all duration-300"
          [class.lg:hidden]="!layoutService.sidebarExpanded()">Boilerplate</span>
      </div>
    </div>

    <div class="flex-grow overflow-y-auto">
      <app-navigation [items]="menuItems" mode="vertical"></app-navigation>
    </div>

    <div class="p-4 border-t border-border flex justify-end">
      <button (click)="layoutService.toggleSidebar()"
        class="w-8 h-8 flex items-center justify-center rounded text-muted-foreground hover:bg-accent hover:text-accent-foreground transition-all duration-300">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
          class="transition-transform duration-300"
          [style.transform]="layoutService.sidebarExpanded() ? 'rotate(0deg)' : 'rotate(180deg)'">
          <path d="m15 18-6-6 6-6" />
        </svg>
      </button>
    </div>
  </aside>

  <!-- Main Content Area -->
  <div class="flex-grow flex flex-col min-w-0">
    <header
      class="h-16 flex-shrink-0 bg-header-bg backdrop-blur-md border-b border-border flex items-center justify-between px-6 sticky top-0 z-40 gap-4">
      <div class="flex items-center gap-3 min-w-0 flex-shrink-0">
        <!-- Mobile Toggle -->
        <button
          class="lg:hidden w-10 h-10 flex items-center justify-center rounded-md text-muted-foreground hover:bg-accent/20 transition-all duration-200"
          (click)="mobileSidebarOpen.set(true)">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="4" x2="20" y1="12" y2="12" />
            <line x1="4" x2="20" y1="6" y2="6" />
            <line x1="4" x2="20" y1="18" y2="18" />
          </svg>
        </button>

        <div class="hidden md:flex items-center gap-2 ml-4 min-w-0" *ngIf="(orgService.organization | async) as org">
          <div class="w-8 h-8 rounded-md overflow-hidden flex items-center justify-center flex-shrink-0"
            *ngIf="org?.logo">
            <img [src]="org.logo" alt="logo" class="w-full h-full object-contain" />
          </div>
          <div
            class="w-8 h-8 rounded-md overflow-hidden flex items-center justify-center flex-shrink-0 bg-primary text-primary-foreground font-extrabold text-lg"
            *ngIf="!org?.logo">
            {{ (org?.oname || 'O').charAt(0).toUpperCase() }}
          </div>
          <div class="text-lg font-bold text-primary tracking-[0.5px] truncate">
            {{ org?.oname || '' }}
          </div>
        </div>
      </div>

      <!-- Global Centered Search Bar -->
      <app-navigation-search class="flex-grow max-w-[440px] z-50 hidden md:block"></app-navigation-search>

      <div class="flex items-center gap-3 flex-shrink-0">
        <app-theme-switcher></app-theme-switcher>
        <div class="w-[1px] h-6 bg-border"></div>
        <app-user-menu></app-user-menu>
      </div>
    </header>

    <main class="flex-grow p-6 flex flex-col min-h-0 overflow-y-auto">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
