server {
    listen 80;
    server_name 35.154.124.206.nip.io;

    # Redirect all HTTP to HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name 35.154.124.206.nip.io;

    ssl_certificate /etc/letsencrypt/live/35.154.124.206.nip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/35.154.124.206.nip.io/privkey.pem;

    root /usr/share/nginx/html;
    index index.html;

    # Increase max upload size
    client_max_body_size 10M;

    # Handle Angular routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API calls to backend
    location /api {
        proxy_pass http://backend:4065;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        client_max_body_size 10M;
    }
}